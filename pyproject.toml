[project]
name = "kiss-discovery-engine"
version = "0.1.0"
description = "Evidence-first experimental code search using Mercury and real CreateOS forks"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cristóbal Muñoz" }]
requires-python = ">=3.11"
dependencies = ["createos-sandbox", "httpx", "python-dotenv"]

[project.urls]
Repository = "https://github.com/Grizaceo/kiss-discovery-engine-hackathon"

[project.scripts]
kiss = "kiss_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiss_engine"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
